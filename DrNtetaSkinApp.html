<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#1B3F9E"/><title>Dr Nteta Skin App</title><style>html,body{margin:0;height:100%;background:#F5F7FB;font-family:system-ui;color:#1B3F9E}</style></head><body><p id="b" style="padding:2rem">Loading…</p><script>(async()=>{const n=15;const p=[];for(let i=0;i<n;i++){const r=await fetch('assets/app.s'+i+'.txt');if(!r.ok)throw new Error(r.status+' s'+i);p.push(await r.text())}document.open();document.write(p.join(''));document.close()})().catch(e=>{b.textContent='Fail '+e})</script></body></html>
