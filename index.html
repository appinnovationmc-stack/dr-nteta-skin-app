<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dr Nteta Skin — Kind2Skin</title>
</head><body>
<p id="m" style="font-family:Montserrat,sans-serif;padding:24px;color:#1B3F9E">Loading Kind2Skin…</p>
<script>
(async()=>{
  const parts=await Promise.all([0,1,2,3,4].map(i=>fetch('https://raw.githubusercontent.com/appinnovationmc-stack/dr-nteta-skin-app/feature/point-quotes/_rebuild/p'+i+'.txt?raw=1').then(r=>{if(!r.ok)throw new Error('part '+i);return r.text()})));
  const html=parts.join('');
  document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('m').textContent='Load failed: '+e;});
</script>
</body></html>
