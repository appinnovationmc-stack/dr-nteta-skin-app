<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dr Nteta Skin App</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone">
  <div class="notch"><div class="notch-dot"></div><div class="notch-bar"></div></div>
  <div class="status"><span style="font-weight:600;font-size:12px">9:41</span><span>▐▐▐ WiFi ▪</span></div>
  <div id="toast"></div>

  <div class="screen active" id="s-splash">
    <div class="splash-mark"><div class="splash-monogram">DN</div></div>
    <div class="splash-wordmark">Dr Nteta<br>Skin App</div>
    <div class="splash-sub">Your dermatologist, in your pocket</div>
    <div class="splash-actions">
      <button class="btn-primary" onclick="go('home')" style="width:100%">Get Started</button>
      <button class="btn-outline" onclick="go('home')" style="width:100%">Sign In</button>
      <p style="text-align:center;font-size:11px;color:var(--white40);margin-top:8px">Powered by Dr Leslie Nteta · Pretoria</p>
    </div>
  </div>

  <div class="screen" id="s-home"></div>
  <div class="screen" id="s-checker"></div>
  <div class="screen" id="s-results"><div class="scroll" id="results-body"></div></div>
  <div class="screen" id="s-shop"></div>
  <div class="screen" id="s-consult"></div>
  <div class="screen" id="s-routine"></div>
</div>
<script src="screens.js"></script>
<script src="app.js"></script>
</body>
</html>
